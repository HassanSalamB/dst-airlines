name: CI/CD

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/hassansalamb/dst-airlines-api:${{ github.sha }}
  DASHBOARD_IMAGE: ghcr.io/hassansalamb/dst-airlines-dashboard:${{ github.sha }}

jobs:
  test:
    name: Test applications
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: airlines
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: airlines_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airlines -d airlines_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://airlines:ci_test_password@localhost:5432/airlines_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            dashboard/requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r api/requirements.txt \
            -r dashboard/requirements.txt \
            -r requirements-test.txt

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Initialize test database
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql --host localhost --username airlines --dbname airlines_test \
            --set ON_ERROR_STOP=1 --file database/sql/init.sql
          psql --host localhost --username airlines --dbname airlines_test \
            --set ON_ERROR_STOP=1 --file database/sql/test_seed.sql

      - name: Run API tests
        working-directory: api
        run: python -m pytest -q test_api.py

      - name: Run dashboard tests
        working-directory: dashboard
        run: python -m pytest -q test_data.py

  infrastructure:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate -no-color

  images:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs:
      - test
      - infrastructure

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build dashboard image
        uses: docker/build-push-action@v7
        with:
          context: dashboard
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.DASHBOARD_IMAGE }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  security:
    name: Scan published images
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name != 'pull_request'

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan API image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Scan dashboard image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DASHBOARD_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

  deploy-kind:
    name: Deploy to Kind and smoke test
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name != 'pull_request'
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Kind cluster
        id: kind
        uses: helm/kind-action@v1
        with:
          cluster_name: dst-airlines-ci
          registry: true
          registry_name: dst-airlines-registry
          registry_port: 5001

      - name: Mirror application images to Kind registry
        env:
          KIND_REGISTRY: ${{ steps.kind.outputs.LOCAL_REGISTRY }}
        run: |
          docker pull "$API_IMAGE"
          docker pull "$DASHBOARD_IMAGE"
          docker tag "$API_IMAGE" "$KIND_REGISTRY/dst-airlines-api:${GITHUB_SHA}"
          docker tag "$DASHBOARD_IMAGE" "$KIND_REGISTRY/dst-airlines-dashboard:${GITHUB_SHA}"
          docker push "$KIND_REGISTRY/dst-airlines-api:${GITHUB_SHA}"
          docker push "$KIND_REGISTRY/dst-airlines-dashboard:${GITHUB_SHA}"
          echo "KIND_API_IMAGE=$KIND_REGISTRY/dst-airlines-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "KIND_DASHBOARD_IMAGE=$KIND_REGISTRY/dst-airlines-dashboard:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Deploy application
        env:
          POSTGRES_PASSWORD: ci_runtime_password
          NEO4J_PASSWORD: ci_neo4j_password
          NEO4J_AUTH: neo4j/ci_neo4j_password
          DATABASE_URL: postgresql+psycopg2://airlines:ci_runtime_password@db:5432/airlines_db
          API_IMAGE: ${{ env.KIND_API_IMAGE }}
          DASHBOARD_IMAGE: ${{ env.KIND_DASHBOARD_IMAGE }}
        run: |
          ./scripts/deploy-k8s.sh

      - name: Smoke test API and dashboard
        run: |
          kubectl --namespace dst-airlines port-forward service/api 18000:8000 > /tmp/api-port-forward.log 2>&1 &
          api_port_forward_pid=$!
          kubectl --namespace dst-airlines port-forward service/dashboard 18050:8050 > /tmp/dashboard-port-forward.log 2>&1 &
          dashboard_port_forward_pid=$!
          trap 'kill "$api_port_forward_pid" "$dashboard_port_forward_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/ >/tmp/api-health.json; then
              break
            fi
            sleep 2
          done
          python -c 'import json; assert json.load(open("/tmp/api-health.json"))["status"] == "ok"'
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:18050/ >/dev/null

      - name: Show Kubernetes diagnostics
        if: failure()
        run: |
          kubectl --namespace dst-airlines get all
          kubectl --namespace dst-airlines get events --sort-by=.lastTimestamp
          kubectl --namespace dst-airlines logs deployment/api --tail=200 || true
          kubectl --namespace dst-airlines logs deployment/dashboard --tail=200 || true
