services:

  db:
    container_name: pg_airlines_prod
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: airlines
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airlines_db
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
      - ./database/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  mongo:
    container_name: mongo_airlines_prod
    image: mongo:7
    restart: always
    volumes:
      - mongo_data_prod:/data/db

  kafka:
    image: apache/kafka:3.8.1
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  live-collector:
    build: ./collector
    restart: always
    command: ["python", "gulf_live.py", "--mode", "producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENSKY_POLL_SECONDS: ${OPENSKY_POLL_SECONDS:-60}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
    depends_on:
      - kafka

  live-consumer:
    build: ./collector
    restart: always
    command: ["python", "gulf_live.py", "--mode", "consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_URL: mongodb://mongo:27017/
      MONGO_DB: airlines_db
    depends_on:
      - kafka
      - mongo

  neo4j:
    container_name: neo4j_airlines_prod
    image: neo4j:5
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data_prod:/data

  api:
    container_name: airlines_api_prod
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://airlines:${POSTGRES_PASSWORD}@db:5432/airlines_db
      MONGO_URL: mongodb://mongo:27017/
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: ${NEO4J_PASSWORD}
      MODEL_PATH: /app/logistic_regression.pkl
      DEBUG: "false"
    depends_on:
      - db
      - mongo

  dashboard:
    container_name: airlines_dashboard_prod
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8050:8050"
    environment:
      API_URL: http://api:8000
      DATABASE_URL: postgresql+psycopg2://airlines:${POSTGRES_PASSWORD}@db:5432/airlines_db
      DEBUG: "false"
    depends_on:
      - api

  prometheus:
    container_name: prometheus_airlines_prod
    image: prom/prometheus:v2.53.0
    restart: always
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - api

  grafana:
    container_name: grafana_airlines_prod
    image: grafana/grafana:11.1.0
    restart: always
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pg_data_prod:
  mongo_data_prod:
  neo4j_data_prod:
  prometheus_data_prod:
  grafana_data_prod:
