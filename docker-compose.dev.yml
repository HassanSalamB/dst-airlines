services:

  db:
    container_name: pg_airlines_dev
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: airlines
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airlines_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
      - ./database/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  mongo:
    container_name: mongo_airlines_dev
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db

  neo4j:
    container_name: neo4j_airlines_dev
    image: neo4j:5
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data_dev:/data

  api:
    container_name: airlines_api_dev
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://airlines:${POSTGRES_PASSWORD}@db:5432/airlines_db
      MONGO_URL: mongodb://mongo:27017/
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: ${NEO4J_PASSWORD}
      MODEL_PATH: /app/logistic_regression.pkl
      DEBUG: "true"
    volumes:
      - ./api:/app
    depends_on:
      - db
      - mongo

  dashboard:
    container_name: airlines_dashboard_dev
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8050:8050"
    environment:
      API_URL: http://api:8000
      DATABASE_URL: postgresql+psycopg2://airlines:${POSTGRES_PASSWORD}@db:5432/airlines_db
      DEBUG: "true"
    depends_on:
      - api

volumes:
  pg_data_dev:
  mongo_data_dev:
  neo4j_data_dev: